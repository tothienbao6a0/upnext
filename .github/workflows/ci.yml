name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both matter: the local adapter and the Python example behave differently
    # depending on which player binaries exist, and macOS is the only place
    # afplay is exercised at all.
    #
    # The Spotify adapter deliberately needs neither. It drives a macOS app and
    # a network API, and both are injected, so its whole suite runs on Linux
    # with no Spotify, no account and no network — which is the point: a backend
    # you cannot test without an account is a backend nobody will contribute to.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ffmpeg gives Linux an `ffplay`, so `upnext-adapter-local` is genuinely
      # exercised on this leg instead of reporting itself unavailable and
      # skipping the tests that matter most for it. macOS has `afplay` built in.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # playerctl is the real client this package shells out to, and the rest is
      # a session bus plus enough Python to publish a real MPRIS player on it.
      #
      # Without a player, playerctl exits on "No players found" before it ever
      # reads our format template — so a run with no fixture cannot tell a valid
      # template from a typo. That is the entire reason for the D-Bus fixture.
      - name: Install playerctl and a session bus
        if: runner.os == 'Linux'
        run: sudo apt-get install -y playerctl python3-dbus python3-gi dbus-x11

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Run separately rather than folded into `npm test`: this needs a session
      # bus wrapped around it, and a fixture player sitting on the bus would
      # otherwise be visible to every other suite in the workspace.
      - name: Now Playing on Linux, against a real player
        if: runner.os == 'Linux'
        run: dbus-run-session -- scripts/mpris-ci.sh

  demo:
    # The demo is the oracle that found the bugs the unit tests did not, so it
    # runs on every change rather than being something to remember to try.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Play the queue end to end
        run: node packages/demo/dist/src/cli.js
