name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both matter: the local adapter and the Python example behave differently
    # depending on which player binaries exist, and macOS is the only place
    # afplay is exercised at all.
    #
    # The Spotify adapter deliberately needs neither. It drives a macOS app and
    # a network API, and both are injected, so its whole suite runs on Linux
    # with no Spotify, no account and no network — which is the point: a backend
    # you cannot test without an account is a backend nobody will contribute to.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ffmpeg gives Linux an `ffplay`, so `upnext-adapter-local` is genuinely
      # exercised on this leg instead of reporting itself unavailable and
      # skipping the tests that matter most for it. macOS has `afplay` built in.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  demo:
    # The demo is the oracle that found the bugs the unit tests did not, so it
    # runs on every change rather than being something to remember to try.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Play the queue end to end
        run: node packages/demo/dist/src/cli.js
